<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<style>
:root { --bg:#ffe41a; --fg:#0c0c10; --rule:#0c0c10; }
@media (prefers-color-scheme: dark) { :root { --bg:#08080c; --fg:#c9c9d6; --rule:#2a2a36; color-scheme: dark; } }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--fg); font:16px/1.4 "Helvetica Neue", Arial, system-ui, sans-serif; padding: calc(env(safe-area-inset-top) + 24px) 18px env(safe-area-inset-bottom); box-sizing:border-box; }
h1 { font-size:52px; line-height:.88; font-weight:900; letter-spacing:-.04em; text-transform:uppercase; margin:0 0 18px; padding-bottom:14px; border-bottom:4px solid var(--rule); }
p { margin:0 0 24px; max-width:34ch; font-weight:500; }
button { font:800 13px "Helvetica Neue", Arial, sans-serif; letter-spacing:.06em; text-transform:uppercase; border:0; padding:16px 22px; background:var(--fg); color:var(--bg); }
</style></head>
<body>
<h1>Offline</h1>
<p>Shelf needs the internet to open. Your saved spots are safe on this phone. Check Wi-Fi or mobile data, then try again.</p>
<button type="button" onclick="location.href='https://mokingsacc.github.io/shelf/'">Try again</button>
</body></html>
