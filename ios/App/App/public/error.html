<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelf</title>
<style>
:root { --bg:#FBFBF9; --fg:#1C1D1F; --muted:#6E7078; --accent:#2B4C9B; }
@media (prefers-color-scheme: dark) { :root { --bg:#17181B; --fg:#ECECE8; --muted:#9A9BA3; --accent:#8FA8E8; color-scheme: dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, system-ui, sans-serif; padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); }
main { max-width: 34ch; }
h1 { font: 400 34px/1.1 "Iowan Old Style", Georgia, serif; margin: 0 0 12px; }
p { color: var(--muted); margin: 0 0 22px; }
button { font: 600 15px -apple-system, system-ui, sans-serif; border:0; border-radius:10px; padding:13px 20px; background:var(--fg); color:var(--bg); }
</style></head>
<body><main>
<h1>Shelf can't open right now</h1>
<p>Shelf needs the internet to open. Your saved spots are safe on this phone. Check Wi-Fi or mobile data, then try again.</p>
<button type="button" onclick="location.href='https://mokingsacc.github.io/shelf/'">Try again</button>
</main></body></html>
