# Checks that the iPhone shell still compiles whenever its native code changes, so a reinstall on Mo's Mac
# never stops at a build error. Builds for the simulator with signing off; nothing is installed or uploaded.
name: iPhone shell builds
on:
  push:
    paths: ['ios/**', '.github/workflows/ios-build.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Build the app for the simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && code=0 || code=$?
          tail -40 build.log
          # Compile errors as annotations too, so they show on the check without opening the log
          if [ "$code" != 0 ]; then
            { grep -iE "error|failed" build.log || tail -5 build.log; } | grep -v "^\s*$" | sort -u | head -12 | while IFS= read -r l; do echo "::error::${l#*/ios/}"; done
          fi
          exit $code
