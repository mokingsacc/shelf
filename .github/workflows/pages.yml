# Publishes the site (https://mokingsacc.github.io/shelf/, which the iPhone app loads) after every push to main.
# GitHub Pages stopped rebuilding by itself after 23 Oct 2026: pushes and merges made through apps don't start a
# Pages build, so the live site stayed on an old version. This asks GitHub for the build instead.
name: Publish the site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Ask GitHub Pages to rebuild from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS --fail-with-body -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
